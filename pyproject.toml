[project]
name = "devsync-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.110.0",
  "uvicorn==0.28.0",
  "pydantic==2.10.6",
]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"
